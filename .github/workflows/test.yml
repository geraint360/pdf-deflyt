name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # manual trigger also available

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        id: install-macos
        run: |
          brew update
          brew install ghostscript pdfcpu qpdf mupdf-tools exiftool poppler coreutils parallel imagemagick zsh jpeg-turbo jbig2enc
          pdfcpu version

      # PyMuPDF for the image helper (ICC images and the photo cap), where the installer puts it
      - name: Install PyMuPDF (macOS)
        run: |
          set -euxo pipefail
          python3 -m venv "$HOME/bin/.pdf-deflyt-venv"
          "$HOME/bin/.pdf-deflyt-venv/bin/python3" -m pip install --quiet PyMuPDF
          "$HOME/bin/.pdf-deflyt-venv/bin/python3" -c 'import fitz; print(fitz.VersionBind)'

      - name: Install linters (macOS)
        run: |
          set -euxo pipefail
          brew install shellcheck shfmt || true

      - name: Lint
        run: make lint

      - name: Smoke
        if: steps.install-macos.outcome == 'success'
        run: make smoke

      - name: Make script executable
        run: chmod +x pdf-deflyt

      - name: Run tests
        env:
          PDF_DEFLYT_TEST_JOBS: "4"
        run: make test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: tests/build/logs

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Homebrew toolchain as macOS (current versions), not the older distro packages
      - name: Install dependencies (Linux, Homebrew)
        id: install-linux
        run: |
          set -euxo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          brew update
          brew install ghostscript pdfcpu qpdf mupdf-tools exiftool poppler coreutils parallel imagemagick zsh jpeg-turbo jbig2enc python shellcheck shfmt
          pdfcpu version; qpdf --version | head -1; magick -version | head -1

      - name: Make script executable
        run: chmod +x pdf-deflyt

      - name: Lint
        run: make lint

      - name: Smoke
        if: steps.install-linux.outcome == 'success'
        run: make smoke

      - name: Run tests
        env:
          PDF_DEFLYT_TEST_JOBS: "4"
        run: make test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux
          path: tests/build/logs
